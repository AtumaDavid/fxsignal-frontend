<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <title>FXSignal — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #09090b;
        color: #ededef;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      p {
        color: #8b8b94;
        font-size: 14px;
        line-height: 1.5;
        max-width: 320px;
      }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 8px;
        border: 0;
        background: #ededef;
        color: #09090b;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div>
      <img
        src="/icon-192.png"
        width="64"
        height="64"
        alt=""
        style="border-radius: 14px"
      />
      <h1 style="font-size: 20px">You're offline</h1>
      <p>
        FXSignal needs a connection for live signals and prices. Reconnect and
        try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
